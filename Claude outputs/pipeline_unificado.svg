<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="800" viewBox="0 0 1960 800" font-family="Helvetica, Arial, sans-serif" style="display:block">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276749"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1960" height="800" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1910" height="90" rx="14" fill="#1a365d"/>
  <text x="975" y="58" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Pipeline general del Motor de Guidance Pedagógico</text>
  <text x="975" y="84" text-anchor="middle" font-size="14" fill="#cbd5e0">Aplicable a cada fase del ciclo PPDAC: Problema · Plan · Datos · Análisis · Conclusión</text>

  <text x="975" y="127" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">🧭 Mantenimiento de la dirección (Wood, Bruner &amp; Ross, 1976): el objetivo de la tarea permanece visible durante toda la fase</text>

  <!-- ============ CHAIN ROW (y 130-240) ============ -->

  <!-- Inicio -->
  <rect x="20" y="140" width="180" height="90" rx="10" fill="#2d3748"/>
  <text x="110" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">🚩 Inicio de fase</text>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#e2e8f0">Seleccionar habilidad</text>
  <text x="110" y="212" text-anchor="middle" font-size="11" fill="#e2e8f0">y tarea de la fase</text>
  <line x1="200" y1="185" x2="215" y2="185" stroke="#2d3748" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <rect x="20" y="236" width="180" height="24" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
  <text x="110" y="252" text-anchor="middle" font-size="9.5" fill="#553c9a">🧩 Reclutamiento (enganche)</text>

  <!-- Nivel 1 -->
  <rect x="215" y="140" width="180" height="90" rx="10" fill="#718096"/>
  <text x="305" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">📋 Nivel 1 · Autonomía</text>
  <text x="305" y="197" text-anchor="middle" font-size="11" fill="#f7fafc">Sin ayuda; registra</text>
  <text x="305" y="212" text-anchor="middle" font-size="11" fill="#f7fafc">respuesta y tiempo</text>
  <line x1="395" y1="185" x2="405" y2="185" stroke="#2d3748" stroke-width="2.2"/>
  <rect x="215" y="236" width="180" height="24" rx="12" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3"/>
  <text x="305" y="252" text-anchor="middle" font-size="9.5" fill="#4a5568">— Sin andamiaje (línea base)</text>
  <text x="215" y="277" font-size="9.5" font-style="italic" fill="#718096">nivel_actual[k] · 1er encuentro → Nivel 1</text>

  <!-- Diamond 1 -->
  <polygon points="475,130 540,185 475,240 410,185" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="475" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">¿Resuelve y</text>
  <text x="475" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">demuestra</text>
  <text x="475" y="204" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">comprensión?</text>

  <!-- No 1 -->
  <line x1="540" y1="185" x2="555" y2="185" stroke="#c53030" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <text x="547" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#c53030">No</text>

  <!-- Nivel 2 -->
  <rect x="555" y="140" width="180" height="90" rx="10" fill="#2b6cb0"/>
  <text x="645" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">💡 Nivel 2 · Orientar</text>
  <text x="645" y="197" text-anchor="middle" font-size="11" fill="#ebf8ff">Pista general, sin</text>
  <text x="645" y="212" text-anchor="middle" font-size="11" fill="#ebf8ff">señalar la solución</text>
  <line x1="735" y1="185" x2="745" y2="185" stroke="#2d3748" stroke-width="2.2"/>
  <rect x="555" y="236" width="180" height="24" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
  <text x="645" y="252" text-anchor="middle" font-size="9.5" fill="#553c9a">🧩 Marca rasgos críticos</text>

  <!-- Diamond 2 -->
  <polygon points="815,130 880,185 815,240 750,185" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="815" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">¿Resuelve y</text>
  <text x="815" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">demuestra</text>
  <text x="815" y="204" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">comprensión?</text>

  <!-- No 2 -->
  <line x1="880" y1="185" x2="895" y2="185" stroke="#c53030" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <text x="887" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#c53030">No</text>

  <!-- Nivel 3 -->
  <rect x="895" y="140" width="180" height="90" rx="10" fill="#2c7a7b"/>
  <text x="985" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">⚙️ Nivel 3 · Dirigir</text>
  <text x="985" y="197" text-anchor="middle" font-size="11" fill="#e6fffa">Alternativas curadas</text>
  <text x="985" y="212" text-anchor="middle" font-size="11" fill="#e6fffa">para elegir</text>
  <line x1="1075" y1="185" x2="1085" y2="185" stroke="#2d3748" stroke-width="2.2"/>
  <rect x="895" y="236" width="180" height="24" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
  <text x="985" y="252" text-anchor="middle" font-size="9.5" fill="#553c9a">🧩 Reduce grados de libertad</text>

  <!-- Diamond 3 -->
  <polygon points="1155,130 1220,185 1155,240 1090,185" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="1155" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">¿Resuelve y</text>
  <text x="1155" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">demuestra</text>
  <text x="1155" y="204" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#744210">comprensión?</text>

  <!-- No 3 -->
  <line x1="1220" y1="185" x2="1235" y2="185" stroke="#c53030" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <text x="1227" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#c53030">No</text>

  <!-- Nivel 4 -->
  <rect x="1235" y="140" width="180" height="90" rx="10" fill="#b7791f"/>
  <text x="1325" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">📄 Nivel 4 · Prescribir</text>
  <text x="1325" y="197" text-anchor="middle" font-size="11" fill="#fffbea">Procedimiento paso</text>
  <text x="1325" y="212" text-anchor="middle" font-size="11" fill="#fffbea">a paso</text>
  <line x1="1415" y1="185" x2="1430" y2="185" stroke="#2d3748" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <rect x="1235" y="236" width="180" height="24" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
  <text x="1325" y="252" text-anchor="middle" font-size="9.5" fill="#553c9a">🧩 Demostración</text>

  <!-- Comprobar comprensión -->
  <rect x="1430" y="140" width="180" height="90" rx="10" fill="#4a5568"/>
  <text x="1520" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">🔍 Comprobar comprensión</text>
  <text x="1520" y="197" text-anchor="middle" font-size="11" fill="#e2e8f0">Verificar que</text>
  <text x="1520" y="212" text-anchor="middle" font-size="11" fill="#e2e8f0">comprende o aplica</text>

  <!-- ============ Sí drops + BKT + Outcome columns ============ -->

  <!-- Column 1 (under diamond 1) -->
  <line x1="475" y1="240" x2="475" y2="285" stroke="#276749" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="486" y="265" font-size="11" font-weight="bold" fill="#276749">Sí</text>
  <rect x="370" y="290" width="210" height="80" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.8"/>
  <text x="475" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#234e52">📊 Actualizar BKT y perfil</text>
  <text x="475" y="333" text-anchor="middle" font-size="10.5" fill="#234e52">respuesta · habilidad ·</text>
  <text x="475" y="348" text-anchor="middle" font-size="10.5" fill="#234e52">ayuda · desempeño</text>
  <line x1="475" y1="370" x2="475" y2="390" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="370" y="393" width="210" height="90" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.8"/>
  <text x="475" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">✅ Nivel mínimo</text>
  <text x="475" y="437" text-anchor="middle" font-size="10.5" fill="#22543d">Se confirma dominio;</text>
  <text x="475" y="452" text-anchor="middle" font-size="10.5" fill="#22543d">sin cambio de nivel</text>

  <!-- Column 2 (under diamond 2) -->
  <line x1="815" y1="240" x2="815" y2="285" stroke="#276749" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="826" y="265" font-size="11" font-weight="bold" fill="#276749">Sí</text>
  <rect x="710" y="290" width="210" height="80" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.8"/>
  <text x="815" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#234e52">📊 Actualizar BKT y perfil</text>
  <text x="815" y="333" text-anchor="middle" font-size="10.5" fill="#234e52">respuesta · habilidad ·</text>
  <text x="815" y="348" text-anchor="middle" font-size="10.5" fill="#234e52">ayuda · desempeño</text>
  <line x1="815" y1="370" x2="815" y2="390" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="710" y="393" width="210" height="90" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.8"/>
  <text x="815" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">⬇ Fading si P(sabe) ≥ 0.75</text>
  <text x="815" y="437" text-anchor="middle" font-size="10.5" fill="#22543d">Próxima prueba Autonomía;</text>
  <text x="815" y="452" text-anchor="middle" font-size="10.5" fill="#22543d">si no, mantiene Orientar</text>

  <!-- Column 3 (under diamond 3) -->
  <line x1="1155" y1="240" x2="1155" y2="285" stroke="#276749" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="1166" y="265" font-size="11" font-weight="bold" fill="#276749">Sí</text>
  <rect x="1050" y="290" width="210" height="80" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.8"/>
  <text x="1155" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#234e52">📊 Actualizar BKT y perfil</text>
  <text x="1155" y="333" text-anchor="middle" font-size="10.5" fill="#234e52">respuesta · habilidad ·</text>
  <text x="1155" y="348" text-anchor="middle" font-size="10.5" fill="#234e52">ayuda · desempeño</text>
  <line x1="1155" y1="370" x2="1155" y2="390" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="1050" y="393" width="210" height="90" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.8"/>
  <text x="1155" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">⬇ Fading si P(sabe) ≥ 0.75</text>
  <text x="1155" y="437" text-anchor="middle" font-size="10.5" fill="#22543d">Próxima prueba Orientar;</text>
  <text x="1155" y="452" text-anchor="middle" font-size="10.5" fill="#22543d">si no, mantiene Dirigir</text>

  <!-- Column 4 (under Comprobar) -->
  <line x1="1520" y1="230" x2="1520" y2="285" stroke="#276749" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="1415" y="290" width="210" height="80" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="1.8"/>
  <text x="1520" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#234e52">📊 Actualizar BKT y perfil</text>
  <text x="1520" y="333" text-anchor="middle" font-size="10.5" fill="#234e52">respuesta · habilidad ·</text>
  <text x="1520" y="348" text-anchor="middle" font-size="10.5" fill="#234e52">ayuda · desempeño</text>
  <line x1="1520" y1="370" x2="1520" y2="390" stroke="#276749" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="1415" y="393" width="210" height="90" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.8"/>
  <text x="1520" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">↔ Retiro obligatorio</text>
  <text x="1520" y="437" text-anchor="middle" font-size="10.5" fill="#22543d">Próxima prueba Dirigir;</text>
  <text x="1520" y="452" text-anchor="middle" font-size="10.5" fill="#22543d">si falla, recupera Prescribir</text>

  <!-- ============ Merge into "Continuar" ============ -->
  <line x1="475" y1="483" x2="475" y2="525" stroke="#2d3748" stroke-width="2"/>
  <line x1="815" y1="483" x2="815" y2="525" stroke="#2d3748" stroke-width="2"/>
  <line x1="1155" y1="483" x2="1155" y2="525" stroke="#2d3748" stroke-width="2"/>
  <line x1="1520" y1="483" x2="1520" y2="525" stroke="#2d3748" stroke-width="2"/>
  <line x1="475" y1="525" x2="1520" y2="525" stroke="#2d3748" stroke-width="2"/>
  <line x1="997" y1="525" x2="997" y2="545" stroke="#2d3748" stroke-width="2.2" marker-end="url(#arrowDark)"/>

  <rect x="757" y="548" width="480" height="60" rx="30" fill="#1a365d"/>
  <text x="997" y="584" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">🎯 Continuar la fase / siguiente tarea</text>

  <text x="997" y="626" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4a5568">El apoyo se ajusta por habilidad; no se reinicia automáticamente entre tareas.</text>
  <text x="997" y="643" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4a5568">🧯 Control de la frustración: se escala en vez de dejar al estudiante estancado, y se recupera apoyo si la reducción falla</text>

  <!-- ============ Footer citation bar ============ -->
  <rect x="20" y="662" width="1610" height="72" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <line x1="556" y1="674" x2="556" y2="722" stroke="#cbd5e0" stroke-width="1.5"/>
  <line x1="1093" y1="674" x2="1093" y2="722" stroke="#cbd5e0" stroke-width="1.5"/>

  <text x="288" y="692" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d3748">📖 Ceneda et al. (2016)</text>
  <text x="288" y="712" text-anchor="middle" font-size="11.5" fill="#4a5568">qué grado de ayuda dar</text>

  <text x="824" y="692" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d3748">👥 Vygotsky · Wood, Bruner &amp; Ross</text>
  <text x="824" y="712" text-anchor="middle" font-size="11.5" fill="#4a5568">cuándo graduar y retirar la ayuda</text>

  <text x="1361" y="692" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d3748">🧠 Kalyuga et al. · Kapur</text>
  <text x="1361" y="712" text-anchor="middle" font-size="11.5" fill="#4a5568">por qué no retirarla antes de tiempo</text>

  <!-- ============ Sidebar (BKT) ============ -->
  <rect x="1650" y="140" width="280" height="594" rx="12" fill="#e6fffa" stroke="#234e52" stroke-width="2"/>
  <rect x="1650" y="140" width="280" height="50" rx="12" fill="#234e52"/>
  <rect x="1650" y="166" width="280" height="24" fill="#234e52"/>
  <text x="1790" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">📊 BKT: después de cada intento</text>

  <text x="1670" y="216" font-size="11.5" fill="#234e52">•  Estima P(dominio) de</text>
  <text x="1682" y="231" font-size="11.5" fill="#234e52">la habilidad k</text>

  <text x="1670" y="255" font-size="11.5" fill="#234e52">•  Se actualiza tras cada</text>
  <text x="1682" y="270" font-size="11.5" fill="#234e52">intento, no solo al resolver</text>

  <text x="1670" y="294" font-size="11.5" fill="#234e52">•  Pondera el nivel de</text>
  <text x="1682" y="309" font-size="11.5" fill="#234e52">ayuda recibido</text>

  <text x="1670" y="333" font-size="11.5" fill="#234e52">•  Correcto con Prescribir ≠</text>
  <text x="1682" y="348" font-size="11.5" fill="#234e52">correcto autónomo</text>

  <text x="1670" y="372" font-size="11.5" fill="#234e52">•  Orienta fading, mantener</text>
  <text x="1682" y="387" font-size="11.5" fill="#234e52">o recuperar apoyo</text>

  <rect x="1670" y="410" width="240" height="80" rx="8" fill="#ffffff" stroke="#234e52" stroke-width="1.8"/>
  <text x="1790" y="460" text-anchor="middle" font-size="34" font-weight="bold" font-style="italic" fill="#234e52">P(Lₖ)</text>

  <rect x="1665" y="620" width="250" height="85" rx="8" fill="#234e52"/>
  <text x="1790" y="645" text-anchor="middle" font-size="11" fill="#ffffff">Se actualiza en cada intento;</text>
  <text x="1790" y="663" text-anchor="middle" font-size="11" fill="#ffffff">el peso de un acierto disminuye</text>
  <text x="1790" y="681" text-anchor="middle" font-size="11" fill="#ffffff">cuanta más ayuda recibió</text>
  <text x="1790" y="699" text-anchor="middle" font-size="11" fill="#ffffff">el estudiante</text>

</svg>
